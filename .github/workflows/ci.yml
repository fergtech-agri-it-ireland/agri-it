name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  database:
    # Applies every migration and the seed to a real local Supabase stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase db start
      - run: supabase db reset
      - run: supabase db lint --level error
      # Review fixes: paid/owed, part deliveries, dated head counts, roles, invites, audit trail
      - run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -q -f scripts/e2e/db_review.sql
      # Move my phone data to my account: a real phone backup through import_phone_backup, twice
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx vitest run src/lib/phoneImport.pg.test.ts
        env:
          AGRI_PG: postgresql://postgres:postgres@127.0.0.1:54322/postgres

  pages:
    # Publishes the phone-only app to https://fergtech-agri-it-ireland.github.io/agri-it/ after the
    # app checks pass, like Gauntlet (records stay on each phone), and the online app to
    # https://fergtech-agri-it-ireland.github.io/agri-it/online/ (records in Supabase project agri-it).
    # Needs the repo public (free GitHub plan) and Settings > Pages > Source set to "GitHub Actions".
    needs: app
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - id: pages
        uses: actions/configure-pages@v5
      # Build for wherever Pages serves this repo ('' for its own address, '/agri-it' for a project page)
      - run: npm run build:pages
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}/
      # The online app (signed in to Supabase), served next to it at online/ as a separate app
      - run: npm run build:online
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}/
      - run: cp -r dist-online dist-pages/online
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages
      - id: deployment
        uses: actions/deploy-pages@v4
